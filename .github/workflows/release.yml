name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify release package
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm/tasklight-cli/package-lock.json

      - name: Validate release metadata
        run: ./scripts/check-release.sh

      - name: Run repository checks
        run: make check

      - name: Build publish-ready package
        run: make npm-package

      - name: Run tarball install smoke test
        run: make package-smoke

      - name: Dry-run npm publish
        working-directory: npm/tasklight-cli
        run: npm publish --dry-run --access public

  publish:
    name: Publish npm package and GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm/tasklight-cli/package-lock.json

      - name: Validate release metadata
        run: ./scripts/check-release.sh

      - name: Require npm trusted-publishing support
        run: |
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE'
          const [major, minor, patch] = process.argv[2].split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error("npm 11.5.1 or newer is required for trusted publishing");
          }
          NODE

      - name: Build publish-ready package
        run: make npm-package

      - name: Run tarball install smoke test
        run: make package-smoke

      - name: Publish to npm with provenance
        working-directory: npm/tasklight-cli
        run: npm publish --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify release package
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm/tasklight-cli/package-lock.json

      - name: Validate release metadata
        run: ./scripts/check-release.sh

      - name: Run repository checks
        run: make check

      - name: Build publish-ready package
        run: make npm-package

      - name: Run tarball install smoke test
        run: make package-smoke

      - name: Generate Homebrew formula
        if: github.ref_type == 'tag'
        run: |
          mkdir -p dist
          source_archive="tasklight-$GITHUB_REF_NAME-source.tar.gz"
          git archive --format=tar.gz --prefix="tasklight-${GITHUB_REF_NAME#v}/" HEAD > "dist/$source_archive"
          source_sha256="$(shasum -a 256 "dist/$source_archive" | awk '{print $1}')"
          formula_root="$(mktemp -d)"
          ./scripts/generate-homebrew-formula.sh "${GITHUB_REF_NAME#v}" "$source_sha256" "$formula_root/Formula/tasklight.rb"
          (cd "$formula_root" && brew style Formula/tasklight.rb)
          cp "$formula_root/Formula/tasklight.rb" dist/tasklight.rb
          printf '%s  %s\n' "$source_sha256" "$source_archive" > dist/source-checksum.txt

      - name: Upload Homebrew formula
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Dry-run npm publish
        working-directory: npm/tasklight-cli
        run: npm publish --dry-run --access public

  publish:
    name: Publish npm package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/@tasklight/cli
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm/tasklight-cli/package-lock.json

      - name: Validate release metadata
        run: ./scripts/check-release.sh

      - name: Require npm trusted-publishing support
        run: |
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE'
          const [major, minor, patch] = process.argv[2].split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error("npm 11.5.1 or newer is required for trusted publishing");
          }
          NODE

      - name: Build publish-ready package
        run: make npm-package

      - name: Run tarball install smoke test
        run: make package-smoke

      - name: Publish to npm with provenance
        working-directory: npm/tasklight-cli
        run: npm publish --provenance --access public

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified Homebrew formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: dist

      - name: Create GitHub release for verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  verify-published-release:
    name: Verify npm and GitHub release agreement
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require matching published versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_version="${GITHUB_REF_NAME#v}"
          published_version=""
          for attempt in 1 2 3 4 5 6; do
            published_version="$(npm view @tasklight/cli version 2>/dev/null || true)"
            [[ "$published_version" == "$expected_version" ]] && break
            sleep 10
          done
          [[ "$published_version" == "$expected_version" ]] || {
            echo "npm latest is $published_version; expected $expected_version" >&2
            exit 1
          }
          release_tag="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$release_tag" == "$GITHUB_REF_NAME" ]] || {
            echo "GitHub release tag is $release_tag; expected $GITHUB_REF_NAME" >&2
            exit 1
          }
